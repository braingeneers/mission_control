events {}
http {
    server {
        listen 8080;
        include /etc/nginx/vhost.d/data-explorer.braingeneers.gi.ucsc.edu;
        location / {
            include /etc/nginx/vhost.d/data-explorer.braingeneers.gi.ucsc.edu_location;
            proxy_pass http://127.0.0.1:8082;
        }
    }
    server {
        listen 4180;
        location /oauth2/auth {
            add_header X-Auth-Request-Email fixture@example.org always;
            if ($http_authorization = "Bearer test-auth") { return 204; }
            return 401;
        }
    }
    server {
        listen 8082;
        location / { return 200 'backend reached'; }
    }
}
